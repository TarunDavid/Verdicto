{% load i18n %}<details class="mt-3 glass rounded-xl px-4 py-3 text-sm group" {% if my_opinion %}open{% endif %}>
  <summary class="cursor-pointer list-none flex items-center gap-2 text-zinc-300">
    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M7 11v9H4v-9zM7 11l4-8a3 3 0 0 1 3 3v4h5a2 2 0 0 1 2 2.3l-1.2 6A2 2 0 0 1 17.8 20H7"/></svg>
    {% translate "Give your verdict" %} <span class="text-xs text-zinc-500">{% translate "(community vote · counts a little)" %}</span>
  </summary>
  <form method="post" action="{% url 'community_vote' claim.pk %}" class="mt-3 space-y-2">{% csrf_token %}
    <input type="hidden" name="next" value="{{ next }}">
    <div class="flex flex-wrap gap-2">
      <label class="inline-flex items-center gap-1.5 rounded-full glass px-3 py-1 cursor-pointer has-[:checked]:border-green-400/70 has-[:checked]:bg-green-400/10"><input type="radio" name="verdict" value="TRUE" required class="sr-only" {% if my_opinion.verdict == "TRUE" %}checked{% endif %}>{% translate "True" %}</label>
      <label class="inline-flex items-center gap-1.5 rounded-full glass px-3 py-1 cursor-pointer has-[:checked]:border-red-400/70 has-[:checked]:bg-red-400/10"><input type="radio" name="verdict" value="FALSE" class="sr-only" {% if my_opinion.verdict == "FALSE" %}checked{% endif %}>{% translate "False" %}</label>
      <label class="inline-flex items-center gap-1.5 rounded-full glass px-3 py-1 cursor-pointer has-[:checked]:border-orange-400/70 has-[:checked]:bg-orange-400/10"><input type="radio" name="verdict" value="MISLEADING" class="sr-only" {% if my_opinion.verdict == "MISLEADING" %}checked{% endif %}>{% translate "Misleading" %}</label>
      <label class="inline-flex items-center gap-1.5 rounded-full glass px-3 py-1 cursor-pointer has-[:checked]:border-zinc-300/70 has-[:checked]:bg-white/10"><input type="radio" name="verdict" value="UNVERIFIED" class="sr-only" {% if my_opinion.verdict == "UNVERIFIED" %}checked{% endif %}>{% translate "Not sure" %}</label>
    </div>
    <div class="flex gap-2">
      <input name="reason" maxlength="200" value="{{ my_opinion.reason|default:'' }}" placeholder="{% translate "Why? (optional, one line)" %}" class="flex-1 rounded-lg bg-white/5 border border-white/10 px-3 py-1.5 focus:outline-none">
      <button class="rounded-lg bg-white text-black px-3 font-medium">{% if my_opinion %}Update{% else %}Submit{% endif %}</button>
    </div>
    <p class="text-xs text-zinc-500">Each community vote counts 0.05; together they can't exceed 20% of the total. Experts decide the final verdict. You can change your vote until then.</p>
  </form>
</details>
