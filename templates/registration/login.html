{% extends "base.html" %}
{% block content %}
<h1 class="text-xl font-bold mb-4">Log in</h1>
<form method="post" class="space-y-3 max-w-sm">{% csrf_token %}
  {% if form.errors %}<p class="text-red-400 text-sm">Wrong username or password.</p>{% endif %}
  <input name="username" placeholder="Username" class="w-full rounded bg-zinc-900 border border-zinc-700 p-2">
  <input name="password" type="password" placeholder="Password" class="w-full rounded bg-zinc-900 border border-zinc-700 p-2">
  <input type="hidden" name="next" value="{{ next }}">
  <button class="bg-accent px-4 py-2 rounded font-medium">Log in</button>
</form>
<p class="mt-4 text-sm text-zinc-400">New here? <a class="underline" href="{% url 'signup' %}">Create a citizen account</a></p>
{% endblock %}
