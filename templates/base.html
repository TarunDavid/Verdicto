<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Verdicto — crowd-verified fact checks{% endblock %}</title>
  {% block meta %}{% endblock %}
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <script>tailwind.config={theme:{extend:{colors:{accent:'#E0383E'}}}}</script>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen" hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
  <nav class="border-b border-zinc-800">
    <div class="max-w-3xl mx-auto px-4 py-3 flex items-center gap-4 text-sm">
      <a href="{% url 'feed' %}" class="font-bold text-lg"><span class="text-accent">Verd</span>icto</a>
      <a href="{% url 'submit' %}" class="ml-auto bg-accent px-3 py-1.5 rounded font-medium">Check a claim</a>
      {% if user.is_authenticated %}
        <span class="text-zinc-400 hidden sm:inline">{{ user.username }} · {{ user.get_role_display }}</span>
        <form method="post" action="{% url 'logout' %}">{% csrf_token %}<button class="text-zinc-400 hover:text-white">Log out</button></form>
      {% else %}
        <a href="{% url 'login' %}" class="text-zinc-300">Log in</a>
      {% endif %}
    </div>
  </nav>
  <main class="max-w-3xl mx-auto px-4 py-6">{% block content %}{% endblock %}</main>
</body>
</html>
